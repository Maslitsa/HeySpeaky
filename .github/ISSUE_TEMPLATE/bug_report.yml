name: Bug report
description: Something does not work, or gets your language wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        [docs/troubleshooting.md](https://github.com/Maslitsa/HeySpeaky/blob/main/docs/troubleshooting.md)
        covers the common ones: nothing heard, the hotkey going dead, and a
        failed install.

        If installing failed, attach `%TEMP%\HeySpeaky-install.log`.

        **Never paste an API key**, including inside a log excerpt.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: |
        What you did, what you expected, what you got instead. If this is
        about recognition, write what you said and what came out.
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Local (Whisper on CPU)
        - Local (Whisper on GPU)
        - OpenAI
        - Not sure
    validations:
      required: true

  - type: textarea
    id: checkup
    attributes:
      label: CHECKUP.bat output
      description: Double-click `CHECKUP.bat` and paste what it prints.
      render: text
