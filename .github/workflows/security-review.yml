name: Security review

# Anthropic's own reviewer reads the diff of a pull request and comments on
# what it finds. It needs one secret, CLAUDE_API_KEY, set under
# Settings > Secrets and variables > Actions. Without it every step is
# skipped and the job passes, so the repository still works for anyone who
# forks it.
#
# The secret is copied into an environment variable first: GitHub does not
# allow the secrets context inside an "if", but it does allow env.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Read the diff for security bugs
    runs-on: ubuntu-latest
    env:
      HAVE_KEY: ${{ secrets.CLAUDE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAVE_KEY == 'true'
        with:
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@main
        if: env.HAVE_KEY == 'true'
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
      - name: Say why nothing ran
        if: env.HAVE_KEY != 'true'
        run: echo "No CLAUDE_API_KEY secret, so the security review was skipped."
