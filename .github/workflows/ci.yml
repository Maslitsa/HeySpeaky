name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Neither job writes anything back. Without this the token inherits whatever
# the repository default is, which on older repositories is read and write.
permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions RealtimeSTT supports: python_requires >=3.11,<3.13.
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile every source file
        run: python -m compileall -q heyspeaky run.py tools

      - name: Fail on syntax warnings
        # Escaped backslashes in Windows paths inside docstrings are an easy
        # mistake to make in this codebase, and they only warn.
        run: python -W error::SyntaxWarning -m compileall -q -f heyspeaky run.py tools

      - name: Install the dependencies the tests need
        # Not the whole requirements file: PyTorch is gigabytes and the tests
        # deliberately avoid anything that needs a sound card or a model.
        run: python -m pip install --quiet numpy httpx webrtcvad-wheels pillow

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Import the modules that need no audio hardware
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from heyspeaky import winjob; print('winjob installs:', winjob.join_kill_on_close())"

      - name: Check the installer and uninstaller parse
        shell: pwsh
        run: |
          foreach ($script in 'install.ps1', 'uninstall.ps1') {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Host "$script parses cleanly"
          }

  install:
    name: Installer on a clean Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Copy the project to where the one-command install puts it
        # Without .git, because uninstall.ps1 never deletes a git clone.
        shell: pwsh
        run: |
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\HeySpeaky'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -Force | Where-Object Name -ne '.git' | Copy-Item -Destination $dest -Recurse -Force

      - name: Run install.ps1
        # Windows PowerShell 5.1 on purpose, because that is what every Windows
        # 10 and 11 machine has. The runner's own Python is never touched: the
        # installer gets Python 3.12 through uv. That, plus the pinned lock
        # file, is what this job exists to keep working. No -NoStart would
        # need a microphone, which a runner does not have. -Backend answers
        # the question a fresh install asks.
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "%LOCALAPPDATA%\Programs\HeySpeaky\install.ps1" -NoStart -NoAutostart -Backend local

      - name: Check the answer was saved
        shell: pwsh
        run: |
          $cfg = Get-Content (Join-Path $env:LOCALAPPDATA 'Programs\HeySpeaky\config.json') -Raw | ConvertFrom-Json
          if ($cfg.transcription.backend -ne 'local') { throw "backend is '$($cfg.transcription.backend)', expected 'local'" }
          # Something for the uninstall to remove. Not a real key.
          New-Item -ItemType File -Force -Path (Join-Path $env:APPDATA 'HeySpeaky\openai.key') -Value 'not-a-key' | Out-Null

      - name: Run uninstall.ps1
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File uninstall.ps1

      - name: Check nothing is left
        shell: pwsh
        run: |
          $left = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\HeySpeaky'),
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'HeySpeaky\HeySpeaky.lnk'),
            (Join-Path $env:APPDATA 'HeySpeaky')
          ) | Where-Object { Test-Path -LiteralPath $_ }
          if ($left) { $left | ForEach-Object { Write-Error "still there: $_" }; exit 1 }
          Write-Host "uninstall removed everything"

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for API keys
        run: |
          if grep -rniE "sk-(proj-)?[A-Za-z0-9_-]{20,}" \
               --include="*.py" --include="*.json" --include="*.md" \
               --include="*.ps1" --include="*.yml" --include="*.txt" .; then
            echo "::error::Something that looks like an API key is committed."
            exit 1
          fi
          echo "No API keys found."
