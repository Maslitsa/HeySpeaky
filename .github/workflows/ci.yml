name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Neither job writes anything back. Without this the token inherits whatever
# the repository default is, which on older repositories is read and write.
permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions RealtimeSTT supports: python_requires >=3.11,<3.13.
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile every source file
        run: python -m compileall -q heyspeaky run.py tools

      - name: Fail on syntax warnings
        # Escaped backslashes in Windows paths inside docstrings are an easy
        # mistake to make in this codebase, and they only warn.
        run: python -W error::SyntaxWarning -m compileall -q -f heyspeaky run.py tools

      - name: Install the dependencies the tests need
        # Not the whole requirements file: PyTorch is gigabytes and the tests
        # deliberately avoid anything that needs a sound card or a model.
        run: python -m pip install --quiet numpy httpx webrtcvad-wheels pillow keyboard

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Import the modules that need no audio hardware
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from heyspeaky import winjob; print('winjob installs:', winjob.join_kill_on_close())"

      - name: Check the installer and uninstaller parse
        shell: pwsh
        run: |
          foreach ($script in 'install.ps1', 'uninstall.ps1') {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Host "$script parses cleanly"
          }

  install:
    name: Installer on a clean Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Copy the project to where the one-command install puts it
        # Without .git, because uninstall.ps1 never deletes a git clone.
        shell: pwsh
        run: |
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\HeySpeaky'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -Force | Where-Object Name -ne '.git' | Copy-Item -Destination $dest -Recurse -Force

      - name: Leave an October SpeakIt to carry back
        # From 26 October to 19 November the app was called SpeakIt, and its
        # installer carried a HeySpeaky across and left a note in it. Such a
        # PC has older settings in the HeySpeaky folder that must not win,
        # and the copy in use in the SpeakIt folder. None of it is a real key.
        shell: pwsh
        run: |
          $hey = Join-Path $env:LOCALAPPDATA 'Programs\HeySpeaky'
          $stale = Join-Path $hey 'config.json'
          '{"transcription": {"cloud": {"keywords": ["Before"]}}}' | Set-Content $stale
          (Get-Item $stale).LastWriteTime = (Get-Date).AddDays(-40)
          'carried' | Set-Content (Join-Path $hey 'MOVED-TO-SPEAKIT.txt')
          $sp = Join-Path $env:LOCALAPPDATA 'Programs\SpeakIt'
          New-Item -ItemType Directory -Force -Path $sp | Out-Null
          'placeholder' | Set-Content (Join-Path $sp 'run.py')
          'placeholder' | Set-Content (Join-Path $sp 'install.ps1')
          '{"transcription": {"cloud": {"api_key_file": "%APPDATA%\\SpeakIt\\openai.key", "keywords": ["CarriedBack"]}}}' |
            Set-Content (Join-Path $sp 'config.json')
          $data = Join-Path $env:APPDATA 'SpeakIt'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          'not-a-key-carried' | Set-Content (Join-Path $data 'openai.key')
          '{"words": [{"heard": "Marzhan", "meant": "Magzhan", "count": 1}]}' | Set-Content (Join-Path $data 'dictionary.json')
          $old = Join-Path $env:APPDATA 'HeySpeaky'
          New-Item -ItemType Directory -Force -Path $old | Out-Null
          'not-a-key-older' | Set-Content (Join-Path $old 'openai.key')

      - name: Run install.ps1
        # Windows PowerShell 5.1 on purpose, because that is what every Windows
        # 10 and 11 machine has. The runner's own Python is never touched: the
        # installer gets Python 3.12 through uv. That, plus the pinned lock
        # file, is what this job exists to keep working. No -NoStart would
        # need a microphone, which a runner does not have. -Backend answers
        # the question a fresh install asks.
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "%LOCALAPPDATA%\Programs\HeySpeaky\install.ps1" -NoStart -NoAutostart -Backend local

      - name: Check the answer was saved
        shell: pwsh
        run: |
          $cfg = Get-Content (Join-Path $env:LOCALAPPDATA 'Programs\HeySpeaky\config.json') -Raw | ConvertFrom-Json
          if ($cfg.transcription.backend -ne 'local') { throw "backend is '$($cfg.transcription.backend)', expected 'local'" }

      - name: Check the SpeakIt was carried back
        shell: pwsh
        run: |
          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          $cfg = Get-Content (Join-Path $programs 'HeySpeaky\config.json') -Raw | ConvertFrom-Json
          if ($cfg.transcription.cloud.keywords -notcontains 'CarriedBack') { throw "the SpeakIt settings did not win: $($cfg.transcription.cloud.keywords)" }
          $key = (Get-Content (Join-Path $env:APPDATA 'HeySpeaky\openai.key') -Raw).Trim()
          if ($key -ne 'not-a-key-carried') { throw 'the key was not carried back' }
          if (-not (Get-ChildItem (Join-Path $env:APPDATA 'HeySpeaky') -Filter 'openai.key.old-*')) { throw 'the older key was not kept' }
          if (-not ((Get-Content (Join-Path $env:APPDATA 'HeySpeaky\dictionary.json') -Raw) -match 'Magzhan')) { throw 'the dictionary was not carried back' }
          if (-not (Test-Path (Join-Path $programs 'SpeakIt\MOVED-TO-HEYSPEAKY.txt'))) { throw 'the SpeakIt folder was not marked as carried' }
          if (Test-Path (Join-Path $programs 'HeySpeaky\MOVED-TO-SPEAKIT.txt')) { throw 'the October note is still in the HeySpeaky folder' }
          $aside = @(Get-ChildItem $programs -Directory -Filter 'HeySpeaky.old-*')
          if ($aside.Count -ne 1) { throw "expected one folder of older settings, found $($aside.Count)" }
          if (-not ((Get-Content (Join-Path $aside[0].FullName 'config.json') -Raw) -match 'Before')) { throw 'the older settings were not kept aside' }
          Write-Host "carried back, and the older settings kept in $($aside[0].Name)"

      - name: Run uninstall.ps1
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File uninstall.ps1

      - name: Check nothing is left
        shell: pwsh
        run: |
          $left = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\HeySpeaky'),
            (Join-Path $env:LOCALAPPDATA 'Programs\SpeakIt'),
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'HeySpeaky\HeySpeaky.lnk'),
            (Join-Path $env:APPDATA 'HeySpeaky'),
            (Join-Path $env:APPDATA 'SpeakIt')
          ) | Where-Object { Test-Path -LiteralPath $_ }
          $left += @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Directory -Filter 'HeySpeaky.old-*' | ForEach-Object FullName)
          if ($left) { $left | ForEach-Object { Write-Error "still there: $_" }; exit 1 }
          Write-Host "uninstall removed everything"

  old-addresses:
    name: The SpeakIt and VoiceType install commands still work
    runs-on: ubuntu-latest
    steps:
      - name: Fetch install.ps1 from the old addresses
        # The one-command install was published, and saved, with each old
        # name in it. GitHub goes on serving a renamed repository under its
        # old names - until somebody makes a new repository with one of them
        # on this account, which this catches.
        run: |
          for name in SpeakIt VoiceType; do
            curl -fsSL "https://raw.githubusercontent.com/Maslitsa/$name/main/install.ps1" -o install.ps1
            grep -q "Installs or updates" install.ps1
            echo "The $name address still serves the installer."
          done

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for API keys
        run: |
          if grep -rniE "sk-(proj-)?[A-Za-z0-9_-]{20,}" \
               --include="*.py" --include="*.json" --include="*.md" \
               --include="*.ps1" --include="*.yml" --include="*.txt" .; then
            echo "::error::Something that looks like an API key is committed."
            exit 1
          fi
          echo "No API keys found."
