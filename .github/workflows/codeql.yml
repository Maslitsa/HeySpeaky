name: CodeQL

# GitHub's own scanner. Free on a public repository, needs no key, and finds
# the things a human reviewer skims past: unsafe subprocess calls, path
# handling, secrets in code paths. Findings appear under Security.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, so a newly published weakness in a dependency pattern is found
    # even in a quiet week.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
