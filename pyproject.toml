# HeySpeaky is an application you run from source, not a library you import,
# so this file is here for metadata and tool configuration rather than for
# publishing to PyPI. Dependencies live in requirements.txt, which is what
# install.ps1 actually uses.

[project]
name = "heyspeaky"
version = "1.0.0"
description = "Background push-to-talk dictation for Windows that survives switching language mid-sentence"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
keywords = ["speech-to-text", "dictation", "whisper", "windows", "voice-typing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/Maslitsa/HeySpeaky"
Issues = "https://github.com/Maslitsa/HeySpeaky/issues"
Changelog = "https://github.com/Maslitsa/HeySpeaky/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
